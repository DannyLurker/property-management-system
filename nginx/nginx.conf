server {
  listen 80;

  # Staff SPA, built locally into apps/pms-pos/dist.
  location / {
    root /srv/pms-pos;
    try_files $uri $uri/ /index.html;
  }

  # API, stripped prefix: /api/health reaches the api as /health.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
